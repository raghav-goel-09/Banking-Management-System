{% extends "base.html" %}{% block title %}Audit log{% endblock %}
{% block body %}<div class="card"><h3>Audit log (latest 200)</h3><table><tr><th>Time (UTC)</th><th>User</th><th>Action</th><th>Details</th><th>IP</th></tr>
{% for r in rows %}<tr><td>{{ r.created_at }}</td><td>{{ r.username or '—' }}</td><td>{{ r.action }}</td><td>{{ r.details }}</td><td>{{ r.ip_address }}</td></tr>{% endfor %}</table></div>{% endblock %}
